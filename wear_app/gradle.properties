org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true

# ---- Your app ----
# Must be exactly your phone app's applicationId: Wear OS only lets two apps talk over the
# Data Layer when they share the id and the signing key.
wearApplicationId=io.github.wearmedia.wear_media_controller_example
# Name shown on the watch.
wearAppName=Wear Media Demo

# Release signing: the same keystore as your phone app. Leave commented to sign with the local
# debug key (fine for trying it with a debug build of your phone app).
#wearKeystoreFile=/path/to/your.keystore
#wearKeystorePassword=
#wearKeyAlias=
#wearKeyPassword=
